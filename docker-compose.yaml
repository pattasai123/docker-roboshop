services:
  mongodb:
    build: 
      context: ./mongodb
      dockerfile: Dockerfile
    image: balaji1729/mongodb:v1
    container_name: mongodb
    volumes:
    - mongodb:/data/db
  catalogue:
    build: 
      context: ./catalogue
      dockerfile: Dockerfile
    image: balaji1729/catalogue:v1
    container_name: catalogue
    depends_on:
      - mongodb
  redis:
    build: 
      context: ./redis
      dockerfile: Dockerfile
    image: balaji1729/redis:v1
    container_name: redis
    volumes:
    - redis:/data
  rabbitmq:
    build: 
      context: ./rabbitmq
      dockerfile: Dockerfile
    image: balaji1729/rabbitmq:v1
    container_name: rabbitmq
    volumes:
    - rabbitmq:/var/lib/rabbitmq
  mysql:
    build: 
      context: ./mysql
      dockerfile: Dockerfile
    image: balaji1729/mysql:v1
    container_name: mysql
    volumes:
    - mysql:/var/lib/mysql  
  user:
    build: 
      context: ./user
      dockerfile: Dockerfile
    image: balaji1729/user:v1
    container_name: user
    depends_on:
      - redis
      - mongodb
  cart:
    build: 
      context: ./cart
      dockerfile: Dockerfile
    image: balaji1729/cart:v1
    container_name: cart
    depends_on:
      - redis
      - catalogue
    
  shipping:
    build: 
      context: ./shipping
      dockerfile: Dockerfile
    image: balaji1729/shipping:v1
    container_name: shipping
    depends_on:
      - cart
      - mysql
  payment:
    build: 
      context: ./payment
      dockerfile: Dockerfile
    image: balaji1729/payment:v1
    container_name: payment
    depends_on:
      - cart
      - user
      - rabbitmq
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    image: balaji1729/frontend:v1
    container_name: frontend
    ports:
      - 80:80
    depends_on:
      - user
      - cart
      - shipping
      - payment

networks:
  default:
    driver: bridge
    name: roboshop
    external: false # true if you have created network manually using docker network command

volumes:
  mongodb: # docker volume create mongodb. /var/lib/docker/volumes
  redis:
  mysql:
  rabbitmq: