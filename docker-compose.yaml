services:
  mongodb:
    image: mongodb:v1
    container_name: mongodb
    volumes:
      - mongodb:/data/db
  catalogue:
    image: catalogue:v1
    container_name: catalogue
    depends_on:
      - mongodb
  redis:
    image: redis:v1
    container_name: redis
    volumes:
      - redis:/data
  rabbitmq:
    image: rabbitmq:v1
    container_name: rabbitmq
    volumes:
      - rabbitmq:/var/lib/rabbitmq
  mysql:
    image: mysql:v1
    container_name: mysql
    volumes:
      - mysql:/var/lib/mysql  
  user:
    image: user:v1
    container_name: user
    volumes:
      - redis
      - mongodb
  cart:
    image: cart:v1
    container_name: cart
    depends_on:
      - cart
      - catalogue
    
  shipping:
    image: shipping:v1
    container_name: shipping
    depends_on:
      - cart
      - mysql
  payment:
    image: payment:v1
    container_name: payment
    depends_on:
      - cart
      - user
      - rabbitmq
  frontend:
    image: frontend:v1
    container_name: frontend
    ports:
      - 80:80
    depends_on:
      - user
      - cart
      - shipping
      - payment

networks:
  default:
    driver: bridge
    name: roboshop
    external: false # true if you have created network manually using docker network command